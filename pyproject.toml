[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "pauli-canonicalizer"
version = "0.1.0"
description = "Canonicalization of Pauli anticommutation graphs and Lie-algebra dimension calculation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]


[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]


[tool.ruff.lint]
select = ["E", "F", "I", "B"]
